<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Tanks - Flashback</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { background: #12110e; overflow: hidden; display: flex; }
      #player-slot { flex: 1; display: flex; }
      #player-slot ruffle-player { width: 100%; height: 100%; }
      #back {
        position: fixed; top: 10px; left: 10px; z-index: 10;
        color: #d7e8ee; background: rgba(4, 10, 14, 0.72);
        border: 1px solid rgba(105, 205, 226, 0.24); border-radius: 5px;
        padding: 0.3rem 0.7rem; text-decoration: none;
        font: 0.85rem/1.5 system-ui, sans-serif; opacity: 0.35;
        transition: opacity 0.15s ease;
      }
      #back:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <a id="back" href="../../" title="Back to the gallery">&larr; Flashback</a>
    <div id="player-slot"></div>
    <script src="../../ruffle/ruffle.js"></script>
