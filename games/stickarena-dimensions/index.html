<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stick Arena: Dimensions - Flashback</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        background: #000; color: #d6d6de; overflow: hidden;
        font: 14px/1.5 system-ui, sans-serif;
        display: flex;
      }
      #player-slot { flex: 1; display: flex; }
      #player-slot ruffle-player { width: 100%; height: 100%; }
      #back {
        position: fixed; top: 10px; left: 10px; z-index: 10;
        color: #cfd2e2; background: rgba(15, 17, 26, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px;
        padding: 0.3rem 0.7rem; text-decoration: none; font-size: 0.85rem;
        opacity: 0.35; transition: opacity 0.15s ease;
      }
      #back:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <a id="back" href="../../" title="Back to the gallery">&larr; Flashback</a>
    <div id="player-slot"></div>
    <script src="../../ruffle/ruffle.js"></script>
    <script type="module" src="../../src/games/stickarena-dimensions/main.ts"></script>
